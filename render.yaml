# Render blueprint for the free tier. Nothing here relies on a persistent disk:
# ws_* tools keep state in the client's GitHub/GitLab repo (WIP branches) and signed tokens, not in /tmp.
services:
  - type: web
    name: odoo-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ODOO_AGENT_API_TOKEN
        sync: false
      - key: ODOO_CLIENTS          # JSON list; each client needs a "token": GitHub contents:write, or GitLab api scope
        sync: false
      - key: GITHUB_TOKEN          # optional fallback for GitHub clients without a token (also used for odoo/odoo core lookups)
        sync: false
      - key: GITLAB_TOKEN          # optional fallback for GitLab clients without a token
        sync: false
      - key: GITLAB_HOSTS          # optional: self-managed GitLab hostnames, comma separated
        sync: false
      - key: ODOO_AGENT_TOON_OUTPUT
        value: auto
      - key: ODOO_AGENT_WS_AUTOCHECKPOINT
        value: "true"
      - key: ODOO_AGENT_WS_PROTECTED_BRANCHES
        value: main,master,production,prod,live
